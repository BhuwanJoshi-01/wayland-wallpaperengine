name: Release

# The release itself is created by a maintainer (so it is authored by them);
# this workflow only builds the extension zip and attaches it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build extension zip
        run: scripts/pack-extension.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
